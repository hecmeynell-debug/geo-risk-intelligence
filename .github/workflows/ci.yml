name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GRI_DATABASE_URL: postgresql+psycopg://gri:gri@localhost:5432/gri

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gri
          POSTGRES_PASSWORD: gri
          POSTGRES_DB: gri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gri -d gri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migrations are complete
        # A model change with no migration is a silent production break. Autogenerate
        # against the migrated database must produce an empty diff.
        run: python scripts/check_migrations_current.py

      - name: Unit and integration tests
        run: pytest --cov=gri --cov-report=term-missing

      - name: Source terms policy
        run: python scripts/check_source_terms.py

  stack:
    name: Compose stack comes up healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build --wait

      - name: Health endpoint reports a migrated database
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8000/health)
          echo "$body"
          echo "$body" | grep -q '"status": *"ok"'
          echo "$body" | grep -q '"pgvector_installed": *true'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
