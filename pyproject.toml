[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geo-risk-intelligence"
version = "0.1.0"
description = "Auditable open-source risk intelligence for maritime, energy, and supply-chain disruption"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "structlog>=24.4",
    # Ingestion. feedparser handles the long tail of real-world RSS/Atom malformation;
    # selectolax parses notice HTML without pulling in a C toolchain at build time.
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "python-dateutil>=2.9",
    # Processing. fastembed runs the embedding model on onnxruntime -- no torch, so
    # the image stays reasonable and the worker needs no GPU.
    "fastembed>=0.4.2",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Postgres with pgvector (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting generated migrations invites merge pain and gains
# nothing. They are reviewed as diffs of intent, not of style.
"migrations/versions/*.py" = ["E501", "I001", "UP"]
# FastAPI's dependency-injection idiom is a call in a default argument.
"src/gri/api/*.py" = ["B008"]
# Assertions read better with the subject first, whichever side ruff prefers.
"tests/*.py" = ["SIM300"]
# Fixture payloads are XML and HTML held verbatim; rewrapping them would change what is
# being tested.
"tests/fixtures.py" = ["E501"]
# Prompt templates are content, not code. Rewrapping a line to satisfy a linter changes
# what the model is shown -- and changes the template hash, which is a versioned
# artefact (ADR-0001 D6).
"src/gri/processing/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# feedparser ships no type information. It is used only behind RssAdapter, whose own
# signature is typed, so the untyped boundary is one module wide.
module = ["feedparser.*"]
ignore_missing_imports = true
